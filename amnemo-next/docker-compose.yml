version: "3.8"

services:
  amnemo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amnemo-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Base de données (externe - REQUIS)
      DATABASE_URL: ${DATABASE_URL}

      # Sécurité (REQUIS - à générer manuellement)
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}

      # Configuration app
      NODE_ENV: production
      PORT: 3000

    # Volumes pour persistance (optionnel)
    volumes:
      # Pour conserver les logs si besoin
      - ./logs:/app/logs

    # Réseau
    networks:
      - amnemo-network

networks:
  amnemo-network:
    driver: bridge
